<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Operations — End to End Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600;700&family=Red+Hat+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --dim: #666680;
    --red: #ee0000;
    --green: #44cc88;
    --amber: #ffaa33;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Red Hat Display', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .tab-bar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex-shrink: 0;
    gap: 0;
  }

  .title-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: 24px;
    flex-shrink: 0;
  }

  .logo-mark {
    width: 24px; height: 24px;
    background: var(--red);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px; color: #fff;
    font-family: 'Red Hat Display', sans-serif;
  }

  .title-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    white-space: nowrap;
  }

  .tabs {
    display: flex;
    height: 100%;
    gap: 0;
  }

  .tab {
    display: flex;
    align-items: center;
    padding: 0 20px;
    height: 100%;
    font-family: 'Red Hat Display', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    user-select: none;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); }

  .tab.active[data-accent="red"] {
    color: var(--red);
    border-bottom-color: var(--red);
  }
  .tab.active[data-accent="green"] {
    color: var(--green);
    border-bottom-color: var(--green);
  }
  .tab.active[data-accent="amber"] {
    color: var(--amber);
    border-bottom-color: var(--amber);
  }

  .tab .key {
    font-family: 'Red Hat Mono', monospace;
    font-size: 10px;
    background: var(--border);
    padding: 1px 5px;
    border-radius: 2px;
    margin-right: 8px;
    color: var(--dim);
  }

  .hint {
    margin-left: auto;
    font-family: 'Red Hat Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    opacity: 0.5;
    flex-shrink: 0;
  }

  .frame-container {
    flex: 1;
    min-height: 0;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<div class="tab-bar">
  <div class="title-area">
    <div class="logo-mark">RH</div>
    <span class="title-text">Security Operations — End to End Demo</span>
  </div>
  <div class="tabs">
    <div class="tab active" data-accent="red" data-src="soc-dashboard.html" onclick="switchTab(this)">
      <span class="key">1</span>The 30-Second Mistake
    </div>
    <div class="tab" data-accent="green" data-src="soc-dashboard-verified.html" onclick="switchTab(this)">
      <span class="key">2</span>The Governed Path
    </div>
    <div class="tab" data-accent="amber" data-src="soc-dashboard-edr.html" onclick="switchTab(this)">
      <span class="key">3</span>Swarm Detection &amp; Response
    </div>
  </div>
  <span class="hint">1 · 2 · 3 to switch</span>
</div>

<div class="frame-container">
  <iframe id="demo-frame" src="soc-dashboard.html"></iframe>
</div>

<script>
const frame = document.getElementById('demo-frame');
const tabs = document.querySelectorAll('.tab');

function switchTab(tab) {
  tabs.forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  frame.src = tab.dataset.src;
}

document.addEventListener('keydown', (e) => {
  if (e.key === '1') switchTab(tabs[0]);
  else if (e.key === '2') switchTab(tabs[1]);
  else if (e.key === '3') switchTab(tabs[2]);
});
</script>

</body>
</html>
