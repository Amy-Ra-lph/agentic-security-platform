settings:
  title: "Act 11: Audit Trail"
  width: 120
  height: 35
  prompt: "root@idm:~# "
  type_speed: 0.04

instructions:
  - type: marker
    label: "Runtime Monitoring — Token Audit Trail"

  - type: comment
    text: "The agent is running. Apache httpd logs every token request."
    pause_after: 1.5

  - type: command
    run: grep "/idp/token" /var/log/httpd/access_log
    output: |
      10.37.153.138 - - [30/Sep/2026:14:00:11 +0200] "POST /idp/token HTTP/1.1" 200 689
      10.37.153.138 - - [30/Sep/2026:14:30:12 +0200] "POST /idp/token HTTP/1.1" 200 689
      10.37.153.138 - - [30/Sep/2026:15:00:10 +0200] "POST /idp/token HTTP/1.1" 200 689
    pause_after: 2.0

  - type: comment
    text: "Healthy pattern: token refresh every 30 minutes, same source IP, HTTP 200."
    pause_after: 1.5

  - type: comment
    text: "Each entry records: source IP, timestamp, endpoint, HTTP status."
    pause_after: 2.0

  - type: command
    run: grep "/idp/token" /var/log/httpd/access_log | awk '{print $4}' | sort | uniq -c | sort -rn | head -5
    output: |
        1 [30/Sep/2026:15:00:10
        1 [30/Sep/2026:14:30:12
        1 [30/Sep/2026:14:00:11
        1 [30/Sep/2026:13:30:09
        1 [30/Sep/2026:13:00:08
    pause_after: 2.0

  - type: comment
    text: "Steady cadence. One request per interval. This agent is behaving normally."
    pause_after: 3.0
