        EXFIL-001  FAIL  Credential file read pattern (.kube/config)
        EXFIL-002  FAIL  Credential file read pattern (.aws/credentials)
        EXFIL-003  FAIL  Environment variable harvesting (secret patterns)
        EXFIL-004  FAIL  Base64 encoding of credential data
        EXFIL-005  FAIL  Outbound POST with encoded payload
        EXFIL-006  FAIL  External URL data transmission
        NET-002    FAIL  TLS verification disabled

        ──────────────────────────────────────────
        Category     Score   Grade
        ──────────────────────────────────────────
        exfiltration   0%     F
        network        0%     F
        overall       18%     F
