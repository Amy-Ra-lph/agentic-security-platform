  - type: comment
    text: "BLOCKED. 6 exfiltration patterns + disabled TLS. Commit rejected."
    pause_after: 1.5

  - type: comment
    text: "The code never reaches the repository. Caught at the developer's workstation."
    pause_after: 3.0
