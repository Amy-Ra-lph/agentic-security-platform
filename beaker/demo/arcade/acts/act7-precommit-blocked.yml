settings:
  title: "Act 7: Pre-commit BLOCKED"
  width: 120
  height: 35
  prompt: "testuser@runner:~/pod-monitor$ "
  type_speed: 0.04

instructions:
  - type: marker
    label: "The Security Gate — Pre-commit Scan"

  - type: comment
    text: "The developer tries to commit. The pre-commit hook triggers skill-audit."
    pause_after: 1.5

  - type: command
    run: git add src/ && git commit -m "Add pod monitor agent"
    output: |

      ═══════════════════════════════════════════════════════════════
