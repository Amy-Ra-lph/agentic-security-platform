settings:
  title: "Act 13: Suspension & Response"
  width: 120
  height: 35
  prompt: "root@idm:~# "
  type_speed: 0.04

instructions:
  - type: marker
    label: "Incident Response — Suspend, Investigate, Decide"

  - type: comment
    text: "Anomaly detected. First move: suspend the agent. Preserve evidence."
    pause_after: 1.5

  - type: comment
    text: "Step 1: Disable HBAC — blocks execution immediately."
    pause_after: 1.0

  - type: command
    run: ipa hbacrule-disable allow-pod-monitor-execution
    output: |
      --------------------------------------------------
      Disabled HBAC rule "allow-pod-monitor-execution"
      --------------------------------------------------
    pause_after: 1.5

  - type: command
    run: ipa hbacrule-show allow-pod-monitor-execution | grep -E "Rule|Enabled|Hosts"
    output: |
        Rule name: allow-pod-monitor-execution
        Enabled: False
        Hosts: runner.demo.agentic.test
    pause_after: 2.0

  - type: comment
    text: "Enabled: False. Agent cannot execute — even with a valid token."
    pause_after: 1.5

  - type: comment
    text: "Step 2: Revoke active tokens."
    pause_after: 1.0

  - type: command
    run: "curl -sk -X POST https://localhost/idp/revoke -d 'token_type_hint=access_token&client_id=8d701d16-3c2a-409e-88ea-809e53f8b3a0'"
    output: |
      {"status": "revoked"}
    pause_after: 1.5

  - type: comment
    text: "Two commands. Under 10 seconds. Agent is fully suspended."
    pause_after: 2.0

  - type: comment
    text: "Identity preserved. Audit trail intact. Now we investigate."
    pause_after: 2.0

  - type: command
    run: "grep '/idp/token' /var/log/httpd/access_log | awk '{print $1}' | sort | uniq -c | sort -rn"
    output: |
       44 192.168.44.99     <-- UNAUTHORIZED
        6 10.37.153.138     <-- expected (runner host)
    pause_after: 2.0

  - type: comment
    text: "Confirmed: credentials used from unknown host. Credential theft."
    pause_after: 1.5

  - type: comment
    text: "If false positive? Re-enable in one command:"
    pause_after: 1.0

  - type: command
    run: "# ipa hbacrule-enable allow-pod-monitor-execution"
    output: |
      (not running — this was real compromise)
    pause_after: 2.0

  - type: command
    run: cat /opt/demo/lifecycle-summary.txt
    output: |
      ┌─────────────┬──────────────────────────────────────────────────┐
      │  Phase       │  What Happened                                  │
      ├─────────────┼──────────────────────────────────────────────────┤
      │  Create      │  AI vibe-coded an agent (looks great, steals creds) │
      │  Gate        │  Pre-commit scan caught 7 critical findings     │
      │  Remediate   │  Fixed agent uses SA auth, no exfil — passed    │
      │  Onboard     │  IPA + HBAC + ahdapa + OpenShell — zero-touch  │
      │  Manage      │  Agent visible in IPA — same tools admins know  │
      │  Monitor     │  Audit trail detects token burst anomaly        │
      │  Respond     │  Suspend → investigate → decide (not destroy)   │
      └─────────────┴──────────────────────────────────────────────────┘
    pause_after: 3.0

  - type: comment
    text: "We didn't destroy the agent — we suspended it. Investigation first, then decide."
    pause_after: 2.0

  - type: comment
    text: "From vibe code to governed — on RHEL, with the tools you already have."
    pause_after: 3.0
