settings:
  title: "Act 12: Anomaly Detected"
  width: 120
  height: 35
  prompt: "root@idm:~# "
  type_speed: 0.04

instructions:
  - type: marker
    label: "Anomaly Detected — Token Burst"

  - type: comment
    text: "Something changed. The httpd access log shows a burst of token requests."
    pause_after: 1.5

  - type: command
    run: grep "/idp/token" /var/log/httpd/access_log | awk '{print $4}' | sort | uniq -c | sort -rn | head -5
    output: |
       47 [30/Sep/2026:15:31:xx
        1 [30/Sep/2026:15:00:10
        1 [30/Sep/2026:14:30:12
        1 [30/Sep/2026:14:00:11
        1 [30/Sep/2026:13:30:09
    pause_after: 2.0

  - type: comment
    text: "47 token requests in ONE MINUTE. Normal pattern is 1 per 30 minutes."
    pause_after: 2.0

  - type: command
    run: grep "/idp/token" /var/log/httpd/access_log | grep "15:31" | awk '{print $1}' | sort | uniq -c | sort -rn
    output: |
       44 192.168.44.99
        3 10.37.153.138
    pause_after: 2.0

  - type: comment
    text: "NEW SOURCE IP: 192.168.44.99 — the agent's credentials are being used from an unknown host."
    pause_after: 2.0

  - type: comment
    text: "Signals: token burst + new source IP = credential compromise."
    pause_after: 1.5

  - type: comment
    text: "Response required: SUSPEND ACCESS IMMEDIATELY."
    pause_after: 3.0
