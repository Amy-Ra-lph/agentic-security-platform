# sandbox-manifest.yml — policy declaration for governed_agent.py
name: governed-agent
version: "1.0"
description: "AI project setup assistant — reads project files, writes reports"

command: "python3 governed_agent.py --task '${TASK}' --project-dir /workspace --output-dir /tmp/output"

allowed_hosts: []

allowed_read_paths:
  - /workspace

allowed_write_paths:
  - /tmp/output

allowed_env_vars:
  - TASK
  - PROJECT_DIR
  - HOME
  - PATH

timeout_seconds: 30
max_output_bytes: 65536
