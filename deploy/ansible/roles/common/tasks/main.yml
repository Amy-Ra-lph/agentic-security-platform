---
- name: Configure /etc/hosts entries
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
    regexp: "{{ item.name }}"
  loop:
    - { ip: "{{ server_ip }}", name: "{{ server_hostname }}" }
    - { ip: "{{ client_ip }}", name: "{{ client_hostname }}" }
    - { ip: "{{ siem_ip }}", name: "{{ siem_hostname }}" }

- name: Install common packages
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - podman
      - openssl
      - strace
    state: present

- name: Create engineer user
  ansible.builtin.user:
    name: "{{ engineer_user }}"
    groups: wheel
    append: true
    state: present

- name: Set engineer password
  ansible.builtin.shell: echo "{{ engineer_user }}:{{ engineer_password }}" | chpasswd
  changed_when: true
