---
- name: Create exfil receiver directory
  ansible.builtin.file:
    path: /opt/demo/exfil-receiver
    state: directory
    mode: "0755"

- name: Generate self-signed cert
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes
    -keyout /opt/demo/exfil-receiver/server-key.pem
    -out /opt/demo/exfil-receiver/server.pem
    -days 7
    -subj "/CN=exfil-receiver.{{ domain }}/O=DEMO"
  args:
    creates: /opt/demo/exfil-receiver/server.pem

- name: Deploy exfil receiver script
  ansible.builtin.copy:
    src: server.py
    dest: /opt/demo/exfil-receiver/server.py
    mode: "0755"

- name: Deploy exfil receiver systemd unit
  ansible.builtin.copy:
    src: exfil-receiver.service
    dest: /etc/systemd/system/exfil-receiver.service

- name: Start exfil receiver
  ansible.builtin.systemd:
    name: exfil-receiver
    state: started
    enabled: true
    daemon_reload: true
