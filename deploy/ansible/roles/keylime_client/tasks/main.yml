---
- name: Install Keylime agent and swtpm
  ansible.builtin.dnf:
    name:
      - keylime-agent
      - swtpm
      - swtpm-tools
      - tpm2-tools
    state: present
  failed_when: false

- name: Create swtpm directory
  ansible.builtin.file:
    path: /var/lib/swtpm
    state: directory
    mode: "0700"

- name: Initialize swtpm (software TPM for demo)
  ansible.builtin.shell: |
    swtpm_setup --tpmstate /var/lib/swtpm --tpm2 --createek 2>/dev/null || true
    swtpm socket --tpmstate dir=/var/lib/swtpm --tpm2 \
      --server type=tcp,port=2321 --ctrl type=tcp,port=2322 \
      --flags startup-clear --daemon 2>/dev/null || true
  args:
    creates: /var/lib/swtpm/tpm2-00.permall

- name: Fetch CV CA cert from server
  ansible.builtin.fetch:
    src: /opt/demo/keylime-ca/cacert.crt
    dest: /tmp/keylime-cv-ca.crt
    flat: true
  delegate_to: server
  failed_when: false

- name: Deploy CV CA cert
  ansible.builtin.copy:
    src: /tmp/keylime-cv-ca.crt
    dest: /var/lib/keylime/cv_ca/cacert.crt
  failed_when: false

- name: Configure Keylime agent
  ansible.builtin.copy:
    content: |
      [agent]
      registrar_ip = "{{ server_ip }}"
      tpm_ownerpassword = ""
    dest: /etc/keylime/agent.conf.d/poc.conf

- name: Ensure agent config directory
  ansible.builtin.file:
    path: /etc/keylime/agent.conf.d
    state: directory

- name: Start Keylime agent
  ansible.builtin.systemd:
    name: keylime_agent
    state: started
    enabled: true
  failed_when: false
