---
- name: Enable ahdapa COPR repo
  ansible.builtin.command: dnf copr enable abbra/modrnizer-darc rhel+epel-10-x86_64 -y
  register: copr_enable
  changed_when: copr_enable.rc == 0
  failed_when: false

- name: Install ahdapa
  ansible.builtin.dnf:
    name: ahdapa
    state: present
  failed_when: false

- name: Ensure ahdapa service is started
  ansible.builtin.systemd:
    name: ahdapa
    state: started
    enabled: true
  failed_when: false

- name: Verify ahdapa OIDC endpoint
  ansible.builtin.uri:
    url: "https://localhost/idp/.well-known/openid-configuration"
    validate_certs: false
    return_content: true
  register: oidc_check
  retries: 3
  delay: 5
  until: oidc_check.status == 200
  failed_when: false
